version: "2"

run:
  # Lint the integration tests too; they build only with this tag.
  build-tags: [integration]

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    errcheck:
      # Writes to stdout/stderr: a CLI has nowhere to report their failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # Files read by mm-cli are the ones the user names on the command line.
        - G304
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/VitalyOstanin/mm-cli
