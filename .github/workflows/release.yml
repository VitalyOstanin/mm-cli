name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the archives
      id-token: write # sign the provenance attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The same checks as CI: a tag never publishes code that fails them.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: go test -race -count=1 -timeout 5m ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Smoke test
        run: |
          go build -trimpath -ldflags "-X main.version=$GITHUB_REF_NAME" -o "$RUNNER_TEMP/mm-cli" ./cmd/mm-cli
          "$RUNNER_TEMP/mm-cli" --version | grep -F "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/mm-cli" --help >/dev/null
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for every archive listed in checksums.txt; verify a
      # download with `gh attestation verify <file> --repo VitalyOstanin/mm-cli`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
