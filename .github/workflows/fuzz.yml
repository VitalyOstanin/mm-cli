name: fuzz

# Longer fuzzing than regular CI, which only runs the seed corpus. An input
# that breaks a target is uploaded; commit it to that package's testdata/fuzz
# as a regression case.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: auth, name: FuzzParseCallback }
          - { pkg: resolve, name: FuzzParse }
          - { pkg: client, name: FuzzRetryAfter }
          - { pkg: client, name: FuzzObserve }
          - { pkg: render, name: FuzzShorten }
          - { pkg: config, name: FuzzValidateProfileName }
          - { pkg: cli, name: FuzzParseSince }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target.name }}
        env:
          PKG: ${{ matrix.target.pkg }}
          NAME: ${{ matrix.target.name }}
        run: go test "./internal/$PKG/" -run '^$' -fuzz "^$NAME\$" -fuzztime 2m
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target.name }}
          path: internal/${{ matrix.target.pkg }}/testdata/fuzz
          if-no-files-found: ignore
